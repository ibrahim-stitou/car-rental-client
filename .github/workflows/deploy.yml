name: Deploy Frontend (Next.js)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/ges-cars-admin/frontend
            
            # 1. Récupérer les changements distant
            git fetch origin main
            
            # 2. Détecter si package-lock.json a été modifié
            NPM_CHANGED=$(git diff --name-only HEAD origin/main | grep "package-lock.json" || true)
            
            # 3. Appliquer le git pull
            git pull origin main
            
            # 4. Mettre à jour les dépendances npm si nécessaire
            if [ -n "$NPM_CHANGED" ]; then
                echo "Package dependencies changed. Running npm ci..."
                npm ci
            fi
            
            # 5. Build de l'application Next.js
            npm run build
            
            # 6. Redémarrer l'application avec PM2
            pm2 reload itiban-frontend || pm2 start npm --name "itiban-frontend" -- start